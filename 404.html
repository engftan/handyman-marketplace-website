<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta

    name="viewport"

    content="width=device-width, initial-scale=1.0"

  >

  <title>Handyman Marketplace</title>

</head>

<body>

  <script>

    (function () {

      const path = window.location.pathname;

      const match = path.match(

        /^\/community\/post\/([0-9a-fA-F-]+)\/?$/

      );

      if (match && match[1]) {

        const postId = encodeURIComponent(match[1]);

        window.location.replace(

          '/community-post.html?id=' + postId

        );

        return;

      }

      document.body.innerHTML =

        '<h1>Page not found</h1>' +

        '<p><a href="/">Return to Handyman Marketplace</a></p>';

    })();

  </script>

</body>

</html>
