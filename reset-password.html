<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password - Handyman Marketplace</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {

      font-family: Arial, sans-serif;

      max-width: 420px;

      margin: 80px auto;

      padding: 20px;

    }

    h2 {

      text-align: center;

    }

    .password-box {

      position: relative;

      margin-top: 12px;

    }

    .password-box input {

      width: 100%;

      padding: 14px;

      padding-right: 60px;

      box-sizing: border-box;

      font-size: 16px;

    }

    .show-button {

      position: absolute;

      right: 8px;

      top: 50%;

      transform: translateY(-50%);

      width: auto;

      padding: 6px;

      border: none;

      background: none;

      cursor: pointer;

      font-size: 14px;

    }

    #changeButton {

      width: 100%;

      padding: 14px;

      margin-top: 18px;

      box-sizing: border-box;

      font-size: 16px;

      cursor: pointer;

    }

    #message {

      margin-top: 18px;

      text-align: center;

    }

  </style>

</head>

<body>

  <h2>Reset Password</h2>

  <div class="password-box">

    <input

      id="password"

      type="password"

      placeholder="New password"

    >

    <button

      type="button"

      class="show-button"

      onclick="togglePassword('password', this)"

    >

      Show

    </button>

  </div>

  <div class="password-box">

    <input

      id="confirmPassword"

      type="password"

      placeholder="Confirm new password"

    >

    <button

      type="button"

      class="show-button"

      onclick="togglePassword('confirmPassword', this)"

    >

      Show

    </button>

  </div>

  <button id="changeButton" onclick="changePassword()">

    Change Password

  </button>

  <p id="message"></p>

  <script>

    const supabaseUrl =

      'https://vrnvrgtgcslalxwownwo.supabase.co';

    const supabaseAnonKey =

      'sb_publishable_dHRZJ3oL2I_TmwHTVgVA8g_-XVvivTl';

    const supabaseClient = supabase.createClient(

      supabaseUrl,

      supabaseAnonKey

    );

    async function initialiseRecoverySession() {

      const message = document.getElementById('message');

      const params =

        new URLSearchParams(window.location.search);

      const code = params.get('code');

      if (code) {

        const { error } =

          await supabaseClient.auth.exchangeCodeForSession(code);

        if (error) {

          message.textContent =

            'This password reset link is invalid or has expired.';

          return;

        }

      }

    }

    initialiseRecoverySession();

    function togglePassword(fieldId, button) {

      const field = document.getElementById(fieldId);

      if (field.type === 'password') {

        field.type = 'text';

        button.textContent = 'Hide';

      } else {

        field.type = 'password';

        button.textContent = 'Show';

      }

    }

    async function changePassword() {

      const password =

        document.getElementById('password').value;

      const confirmPassword =

        document.getElementById('confirmPassword').value;

      const message =

        document.getElementById('message');

      if (!password) {

        message.textContent =

          'Please enter a new password.';

        return;

      }

      if (password.length < 6) {

        message.textContent =

          'Password must be at least 6 characters.';

        return;

      }

      if (password !== confirmPassword) {

        message.textContent =

          'Passwords do not match.';

        return;

      }

      message.textContent = 'Changing password...';

      const { error } =

        await supabaseClient.auth.updateUser({

          password: password

        });

      if (error) {

        message.textContent =

          'Error: ' + error.message;

        return;

      }

      message.textContent =

        'Password changed successfully. You can return to the Handyman Marketplace app and sign in with your new password.';

    }

  </script>

</body>

</html>
