<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password - Handyman Marketplace</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {

      font-family: Arial, sans-serif;

      max-width: 420px;

      margin: 80px auto;

      padding: 20px;

    }

    h2 {

      text-align: center;

    }

    input, button {

      width: 100%;

      padding: 14px;

      margin-top: 12px;

      box-sizing: border-box;

      font-size: 16px;

    }

    button {

      cursor: pointer;

    }

    #message {

      margin-top: 18px;

      text-align: center;

    }

  </style>

</head>

<body>

  <h2>Reset Password</h2>

  <input

    id="password"

    type="password"

    placeholder="New password"

  >

  <input

    id="confirmPassword"

    type="password"

    placeholder="Confirm new password"

  >

  <button onclick="changePassword()">

    Change Password

  </button>

  <p id="message"></p>

<script>

  const supabaseUrl = https://vrnvrgtgcslalxwownwo.supabase.co

  const supabaseAnonKey = 'sb_publishable_dHRZJ3oL2I_TmwHTVgVA8g_-XVvivTl';

  const supabaseClient = supabase.createClient(

    supabaseUrl,

    supabaseAnonKey

  );

  async function changePassword() {

    const password =

      document.getElementById('password').value;

    const confirmPassword =

      document.getElementById('confirmPassword').value;

    const message =

      document.getElementById('message');

    if (!password) {

      message.textContent = 'Please enter a new password.';

      return;

    }

    if (password !== confirmPassword) {

      message.textContent = 'Passwords do not match.';

      return;

    }

    const { error } = await supabaseClient.auth.updateUser({

      password: password

    });

    if (error) {

      message.textContent = 'Error: ' + error.message;

      return;

    }

    message.textContent =

      'Password changed successfully. You can return to the Handyman Marketplace app and sign in.';

  }

</script> 
</body>

</html>
